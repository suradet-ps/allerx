<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ruby panel gradient: #E11D48 (light) -> #881337 (deep) -->
    <linearGradient id="bgRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Soft inner glow under the capsules. There is deliberately no
         outer drop shadow so the icon keeps a clean silhouette at every
         platform size (dock, taskbar, store tiles). -->
    <filter id="innerGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ruby panel -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="96"
    fill="url(#bgRuby)"
    stroke="#FB7185"
    stroke-width="8"
  />

  <!-- Crossed capsules -->
  <g transform="translate(256, 205) scale(1.18)" filter="url(#innerGlow1)">
    <g transform="rotate(-45)">
      <rect x="-120" y="-40" width="240" height="80" rx="40" fill="#FFFFFF" stroke="#9F1239" stroke-width="6" />
      <line x1="0" y1="-40" x2="0" y2="40" stroke="#9F1239" stroke-width="5" />
    </g>
    <g transform="rotate(45)">
      <rect x="-120" y="-40" width="240" height="80" rx="40" fill="#FF1744" stroke="#FFFFFF" stroke-width="6" />
      <line x1="0" y1="-40" x2="0" y2="40" stroke="#FFFFFF" stroke-width="5" />
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(256, 435)">
    <text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="2"><tspan fill="#FFFFFF">Aller</tspan><tspan fill="#FFEBEE">X</tspan></text>
  </g>
</svg>
