# Separate workspace on purpose (AGENTS-RUST.md §14 override): this crate
# compiles for wasm32-unknown-unknown and must not share the native graph.
[workspace]

[package]
name = "allerx-app"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "allerx_app"
path = "src/lib.rs"

[[bin]]
name = "allerx-app"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
allerx-models = { path = "../crates/models" }
allerx-search-core = { path = "../crates/search-core" }
js-sys = "0.3"                  # Promise handle returned by the Tauri IPC bridge
serde = { version = "1.0", features = ["derive"] }  # DeserializeOwned bound on command results
serde-wasm-bindgen = "0.6"      # serde <-> JsValue for invoke args/results
wasm-bindgen = "0.2"            # __TAURI_INTERNALS__.invoke binding
wasm-bindgen-futures = "0.4"    # Promise -> Rust Future

[dev-dependencies]
chrono = "0.4"                  # NaiveDate in test fixtures
leptos = { version = "0.8", features = ["csr"] }  # view!/mount in wasm tests
wasm-bindgen-test = "0.3"       # wasm test harness (ROADMAP Phase 4)
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "InputEvent",
    "KeyboardEvent",
    "KeyboardEventInit",
    "MouseEvent",
    "Node",
    "Text",
    "Window",
] }                            # DOM querying + event dispatch in wasm tests
