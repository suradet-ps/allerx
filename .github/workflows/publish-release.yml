name: "Publish Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependency advisories
        # cargo-deny covers advisories on every PR; this is the loud,
        # dedicated audit on the release path (ROADMAP Phase 4).
        run: cargo audit

  create-release:
    name: Create GitHub release
    needs: cargo-audit
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Resolve the release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(jq -r '.version' src-tauri/tauri.conf.json)"
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or reuse the release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Release creation is owned by this job so the build matrix
          # cannot race itself on the "already exists" API error.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "AllerX $TAG" \
              --notes "See the assets to download this version and install."
          fi
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Build
          - platform: "windows-latest"
            args: ""
            trunk-artifact: "trunk-x86_64-pc-windows-msvc.zip"
          # Linux Build (Ubuntu 24.04)
          - platform: "ubuntu-24.04"
            args: ""
            trunk-artifact: "trunk-x86_64-unknown-linux-gnu.tar.gz"
          # macOS Build (Apple Silicon)
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            trunk-artifact: "trunk-aarch64-apple-darwin.tar.gz"
          # Uncomment if you need Intel Mac support
          # - platform: "macos-latest"
          #   args: "--target x86_64-apple-darwin"
          #   trunk-artifact: "trunk-x86_64-apple-darwin.tar.gz"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust stable (wasm target)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Trunk
        shell: bash
        env:
          TRUNK_VERSION: v0.21.14
          TRUNK_ASSET: ${{ matrix.trunk-artifact }}
        run: |
          # GitHub release downloads occasionally drop the connection;
          # retry before giving up. Windows publishes a .zip asset, the
          # other platforms a .tar.gz - extract with the matching tool.
          mkdir -p "$HOME/.cargo/bin"
          for attempt in 1 2 3 4; do
            if [ "$RUNNER_OS" = "Windows" ]; then
              TRUNK_DIR="$(cygpath -w "$HOME/.cargo/bin")"
              curl.exe -LsSf "https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION/$TRUNK_ASSET" -o trunk.zip \
                && powershell.exe -NoProfile -NonInteractive -Command "Expand-Archive -LiteralPath (Resolve-Path trunk.zip).Path -DestinationPath '$TRUNK_DIR' -Force" \
                && break
            else
              curl -LsSf "https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION/$TRUNK_ASSET" -o trunk.tar.gz \
                && tar -xzf trunk.tar.gz -C "$HOME/.cargo/bin" \
                && break
            fi
            echo "trunk download failed (attempt $attempt/4) - retrying in 10s"
            sleep 10
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -x "$HOME/.cargo/bin/trunk.exe"
          else
            test -x "$HOME/.cargo/bin/trunk"
          fi

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          # The updater is deliberately not configured (B5 in docs/deployment.md);
          # skipping these also avoids the parallel latest.json upload race.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}
